name: Ubuntu Theos ARM64
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/theos-arm64.yml'
      - 'tweak/**'
      - 'scripts/check_macho_arm64.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tweak:
    name: Cross-compile iOS tweak on Ubuntu
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos, arm64 toolchain and iOS SDK
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/theos

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_OS"
          echo "Theos: $THEOS"
          ls -la "$THEOS/sdks"
          find "$THEOS/toolchain" -maxdepth 3 -type f -name clang -print | head -10 || true

      - name: Cross-compile and package arm64 tweak
        working-directory: tweak
        shell: bash
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Verify arm64 Mach-O and prepare downloadable files
        shell: bash
        run: |
          set -euo pipefail
          dylib="$(find tweak/.theos -type f -name UbuntuDemo.dylib -print -quit)"
          if [[ -z "$dylib" ]]; then
            echo "::error::Theos did not create UbuntuDemo.dylib"
            exit 1
          fi
          python3 scripts/check_macho_arm64.py "$dylib"
          mkdir -p dist
          cp "$dylib" dist/UbuntuDemo-arm64.dylib
          shopt -s nullglob
          debs=(tweak/packages/*.deb)
          if (( ${#debs[@]} == 0 )); then
            echo "::error::Theos did not create a .deb package"
            exit 1
          fi
          cp "${debs[@]}" dist/

      - name: Create a reusable Theos source ZIP example
        shell: bash
        run: |
          set -euo pipefail
          (cd tweak && zip -q ../dist/UbuntuDemo-source-example.zip Makefile Tweak.xm UbuntuDemo.plist control)

      - name: Upload ARM64 dylib and tweak package
        uses: actions/upload-artifact@v4
        with:
          name: UbuntuDemo-arm64-Theos
          path: dist/*
          if-no-files-found: error
