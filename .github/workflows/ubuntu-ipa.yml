name: Ubuntu IPA Toolkit
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate or repackage an IPA"
        required: true
        type: choice
        options:
          - validate
          - repackage
          - create
        default: validate
jobs:
  ipa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependencies
        run: python3 --version
      - name: Validate / repackage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input output
          if [[ "${{ inputs.mode }}" == "create" ]]; then
            mapfile -d '' apps < <(find input -maxdepth 1 -type d -name '*.app' -print0 | sort -z)
            if (( ${#apps[@]} != 1 )); then
              echo "::error::Create mode expects exactly one .app directory in input/."
              exit 1
            fi
            app_name="$(basename "${apps[0]}" .app)"
            python3 scripts/ipa_tool.py create "${apps[0]}" --output "output/${app_name}.ipa"
          else
            mapfile -d '' ipas < <(find input -maxdepth 1 -type f -name '*.ipa' -print0 | sort -z)
            if (( ${#ipas[@]} != 1 )); then
              echo "::error::Validate/repackage mode expects exactly one .ipa file in input/."
              exit 1
            fi
            python3 scripts/ipa_tool.py "${{ inputs.mode }}" "${ipas[0]}" --output output
          fi
      - name: Upload result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-ipa-result
          path: output/
          if-no-files-found: error
