name: Ubuntu TapSprint IPA test (26.04)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ubuntu-game-ipa-26.yml'
      - 'game/**'
      - 'scripts/check_macho_arm64.py'
      - 'scripts/ipa_tool.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build TapSprint IPA on Ubuntu 26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_REF: 304e0799973e8145f32e4ca2de6c747a84b758ce
    steps:
      - name: Check out the game source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Restore minimal iPhoneOS 16.5 SDK and toolchain cache
        id: theos-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}/theos/toolchain
            ${{ github.workspace }}/theos/sdks/iPhoneOS16.5.sdk
          key: theos-ubuntu-26.04-toolchain-v2.3.0-sdk0222fd54-iphoneos16.5-v7

      - name: Restore pinned Theos app-build files
        id: theos-core-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}/theos/bin
            ${{ github.workspace }}/theos/include
            ${{ github.workspace }}/theos/lib
            ${{ github.workspace }}/theos/makefiles
            ${{ github.workspace }}/theos/mod
            ${{ github.workspace }}/theos/Prefix.pch
            ${{ github.workspace }}/theos/vendor/include
            ${{ github.workspace }}/theos/vendor/lib
          key: theos-core-ubuntu-26.04-304e0799973e8145f32e4ca2de6c747a84b758ce-v2

      - name: Prepare pinned Theos, toolchain and iPhoneOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail
          missing_packages=()
          for package in fakeroot rsync curl perl zip git make libxml2-16 libtinfo6 libz3-dev unzip; do
            if ! dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null | grep -qx installed; then
              missing_packages+=("$package")
            fi
          done
          if (("${#missing_packages[@]}")); then
            if ! sudo apt-get install -y --no-upgrade "${missing_packages[@]}"; then
              sudo apt-get update
              sudo apt-get install -y --no-upgrade "${missing_packages[@]}"
            fi
          fi
          if [[ ! -f "$THEOS/Prefix.pch" ||
                ! -f "$THEOS/makefiles/common.mk" ||
                ! -f "$THEOS/vendor/include/.git" ||
                ! -f "$THEOS/vendor/lib/.git" ]]; then
            tmp_theos="$(mktemp -d)"
            git clone --depth 1 --no-tags https://github.com/theos/theos "$tmp_theos/theos"
            theos_ref="$(git -C "$tmp_theos/theos" rev-parse HEAD)"
            if [[ "$theos_ref" != "$THEOS_REF" ]]; then
              echo "::error::Expected Theos $THEOS_REF, got $theos_ref"
              exit 1
            fi
            git -C "$tmp_theos/theos" submodule update --init --depth 1 vendor/include vendor/lib
            rsync -a "$tmp_theos/theos/" "$THEOS/"
            rm -rf "$tmp_theos"
          fi
          mkdir -p "$THEOS/toolchain" "$THEOS/sdks"
          if [[ ! -x "$THEOS/toolchain/linux/iphone/bin/clang" ]]; then
            tmp_dl="$(mktemp -d)"
            curl -fL --retry 3 https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu22.04.tar.xz -o "$tmp_dl/toolchain.tar.xz"
            tar -xf "$tmp_dl/toolchain.tar.xz" -C "$THEOS/toolchain"
            rm -rf "$tmp_dl"
          fi
          if [[ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]]; then
            tmp_sdk="$(mktemp -d)"
            curl -fL --retry 3 https://github.com/theos/sdks/archive/0222fd5413cf4b9af096f37b4621afa2688572f7.zip -o "$tmp_sdk/sdk.zip"
            unzip -q "$tmp_sdk/sdk.zip" -d "$tmp_sdk"
            sdk_path="$(find "$tmp_sdk" -type d -name 'iPhoneOS16.5.sdk' -print -quit)"
            if [[ -z "$sdk_path" ]]; then
              echo "::error::Pinned SDK archive does not contain iPhoneOS16.5.sdk"
              exit 1
            fi
            mv "$sdk_path" "$THEOS/sdks/"
            rm -rf "$tmp_sdk"
          fi

      - name: Report Ubuntu build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
          echo "Theos: $THEOS"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          ls -ld "$THEOS/sdks/iPhoneOS16.5.sdk"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          printf "Clang: %s\n" "$THEOS/toolchain/linux/iphone/bin/clang"

      - name: Compile and verify the original UIKit game
        shell: bash
        run: |
          set -euo pipefail
          make -C game -j2 all FINALPACKAGE=1
          app="$(find game/.theos -type d -name 'TapSprint.app' -print -quit)"
          if [[ -z "$app" ]]; then
            echo "::error::Theos did not produce TapSprint.app"
            exit 1
          fi
          cp game/Info.plist "$app/Info.plist"
          test -f "$app/TapSprint"
          python3 - "$app/TapSprint" <<'PY'
          import struct
          import sys
          from pathlib import Path

          header = Path(sys.argv[1]).read_bytes()[:32]
          if len(header) != 32:
              raise SystemExit("App executable has a truncated Mach-O header")
          magic, cpu_type, cpu_subtype, file_type, *_ = struct.unpack("<IiiIIIII", header)
          if magic != 0xFEEDFACF or cpu_type != 0x0100000C or file_type != 2:
              raise SystemExit(
                  f"Expected 64-bit arm64 iOS app executable; "
                  f"got magic={magic:#x}, cpu={cpu_type:#x}, type={file_type}"
              )
          print("Verified 64-bit ARM64 Mach-O application executable.")
          PY
          mkdir -p dist
          python3 scripts/ipa_tool.py create "$app" --output dist/TapSprint-Ubuntu-26.04-unsigned.ipa

      - name: Package and validate unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/TapSprint-Ubuntu-26.04-unsigned.ipa
          python3 scripts/ipa_tool.py validate dist/TapSprint-Ubuntu-26.04-unsigned.ipa --output dist/validation
          {
            echo '### Ubuntu IPA result'
            echo 'TapSprint was built on Ubuntu 26.04 with pinned Theos and the public iPhoneOS 16.5 SDK.'
            echo 'The Linux IPA tool created Payload/TapSprint.app, preserved app-bundle files and symlinks, and verified ZIP CRCs.'
            echo "Theos commit: $THEOS_REF"
            echo "Toolchain/SDK cache hit: ${{ steps.theos-cache.outputs.cache-hit }}"
            echo "Theos source cache hit: ${{ steps.theos-core-cache.outputs.cache-hit }}"
            echo 'The IPA has no Apple certificate or provisioning profile; it must be signed before installation on a stock iPhone.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TapSprint-Ubuntu-26.04-IPA
          path: dist/TapSprint-Ubuntu-26.04-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
