name: Compare Ubuntu vs Xcode SDKs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compare-sdks.yml'
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Theos for Ubuntu
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/theos
      - name: Compile the same neutral test source on Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(find "$THEOS/sdks" -maxdepth 1 -name 'iPhoneOS*.sdk' | sort -V | tail -n1)"
          test -d "$SDK"
          python3 scripts/convert_to_framework_library.py tweak
          make -C tweak clean all FINALPACKAGE=1
          DYLIB="$(find tweak/.theos -type f -name UbuntuDemo.dylib -print -quit)"
          test -n "$DYLIB"
          mkdir -p ubuntu-report
          python3 scripts/macho_audit.py "$DYLIB" --expect-install-name @rpath/UbuntuDemo.dylib --require-arm64-dylib
          python3 scripts/sdk_compare.py collect --os ubuntu --sdk "$SDK" --binary "$DYLIB" --output ubuntu-report/build.json
          cp "$DYLIB" ubuntu-report/UbuntuDemo-ubuntu-arm64.dylib
      - name: Save the Ubuntu evidence
        uses: actions/upload-artifact@v4
        with:
          name: sdk-compare-ubuntu
          path: ubuntu-report/
          if-no-files-found: error
  macos:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up real Xcode iPhoneOS SDK and Theos
        shell: bash
        run: |
          set -euo pipefail
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          THEOS="$GITHUB_WORKSPACE/theos"
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDKROOT=$SDK" >> "$GITHUB_ENV"
          brew list make >/dev/null 2>&1 || brew install make
          brew list ldid >/dev/null 2>&1 || brew install ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          ln -s "$SDK" "$THEOS/sdks/$(basename "$SDK")"
      - name: Compile the same neutral source with Xcode SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/convert_to_framework_library.py tweak
          make -C tweak clean all FINALPACKAGE=1
          DYLIB="$(find tweak/.theos -type f -name UbuntuDemo.dylib -print -quit)"
          test -n "$DYLIB"
          mkdir -p macos-report
          python3 scripts/macho_audit.py "$DYLIB" --expect-install-name @rpath/UbuntuDemo.dylib --require-arm64-dylib
          python3 scripts/sdk_compare.py collect --os macos --sdk "$SDKROOT" --binary "$DYLIB" --output macos-report/build.json
          cp "$DYLIB" macos-report/UbuntuDemo-macos-arm64.dylib
      - name: Save the Xcode SDK evidence
        uses: actions/upload-artifact@v4
        with:
          name: sdk-compare-macos
          path: macos-report/
          if-no-files-found: error
  compare:
    needs: [ubuntu, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sdk-compare-ubuntu
          path: results/ubuntu
      - uses: actions/download-artifact@v4
        with:
          name: sdk-compare-macos
          path: results/macos
      - name: Compare authentic SDK and linked binary details
        shell: bash
        run: |
          set -euo pipefail
          code=0
          python3 scripts/sdk_compare.py compare --macos results/macos/build.json --ubuntu results/ubuntu/build.json --output comparison || code=$?
          test ! -f comparison/comparison.md || cat comparison/comparison.md >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-xcode-vs-ubuntu-comparison
          path: comparison/
          if-no-files-found: warn
