name: Compare Ubuntu vs Xcode SDKs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compare-sdks.yml'
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Show Ubuntu
        run: |
          uname -a
          clang --version
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show original iPhoneOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
